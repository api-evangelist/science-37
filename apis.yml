name: Science 37 *
description: 'Science 37 operates a decentralized, direct-to-patient clinical research
  platform — the first and only FDA-inspected direct-to-patient site — that delivers
  clinical trials to participants wherever they are. Its Metasite and Agile Clinical
  Trial operating model combine patient recruitment, research-grade nursing, telemedicine,
  eConsent, ePRO, wearable/device integration, and EHR data capture into a single
  end-to-end SaaS platform used by sponsors and CROs. Backed by GV and Lux Capital,
  the company has supported 200+ trials across many therapeutic areas. No public developer
  portal or API surface was found during enrichment (developer./api.science37.com
  do not resolve); this profile captures identity and domain-security posture only.'
